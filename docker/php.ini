[PHP]
; Production error handling - never leak stack traces to visitors
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance & Memory for E-Commerce (PDF Invoices & Excel Reports)
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; File Uploads for Product Images and Media
upload_max_filesize = 100M
post_max_size = 108M

; Security hardening
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Localization & Session Defaults
date.timezone = UTC
variables_order = "EGPCS"
session.gc_maxlifetime = 7200
