[opcache]
; Enable OPcache bytecode caching for maximum PHP execution speed
opcache.enable = 1
opcache.enable_cli = 0

; Dedicated memory pool (MB)
opcache.memory_consumption = 256

; Size of string buffer (MB) for method/class names
opcache.interned_strings_buffer = 16

; Maximum cached scripts (should exceed total PHP files in vendor + app)
opcache.max_accelerated_files = 30000

; In production immutable containers, disable file timestamp validation for zero disk checks
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Preserve docblock comments required by PHP 8 attributes & reflection
opcache.save_comments = 1
opcache.fast_shutdown = 1
